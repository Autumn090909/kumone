name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Xcode 26+ ships without the Metal compiler; mlx-swift's .metal sources
      # (StemKit) need it.
      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # Same invocation as release.yml, minus signing / notarization: the
      # script's own ad-hoc signature is all an unsigned build gets.
      - name: Build app (universal, unsigned)
        run: |
          ARCHES="arm64 x86_64" \
            Scripts/build-app.sh release
