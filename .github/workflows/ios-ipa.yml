name: iOS IPA

# Builds an UNSIGNED .ipa on demand.
#
# Unsigned is deliberate. The artifact is not meant to be installed as-is: a
# sideloading tool (AltStore / Sideloadly / ESign / TrollStore) re-signs it with
# a certificate that belongs to the person installing it. That is the only way
# to run a build the project's own Apple team never signed — and it is also why
# this workflow needs no signing secrets at all.
#
# Why a workflow instead of a local build: Kumone is swift-tools-version 6.2, so
# it needs the Swift 6.2 toolchain, which ships with Xcode 26, which requires
# macOS 15.6 or newer. Older macOS cannot build this project at all. Running the
# build here means a contributor on any OS can still produce an installable IPA.
#
# WHAT THIS FORK CHANGES — CarPlay is available, opt-in.
#
# The CarPlay stack (Sources/Kumone/Core/CarPlay/ + CarPlaySceneDelegate) is
# upstream code and is left untouched. All this fork changes is the build
# configuration: an opt-in overlay that adds the Info.plist scene declaration,
# plus an ldid step that injects `com.apple.developer.carplay-audio` into the
# executable after the build. Both are needed; either one alone fails silently,
# and only on a head unit. Off by default — see DEFAULT_CARPLAY below.
#
# HOW TO TRIGGER IT IN A FORK
#
#   Two ways in, deliberately, because the obvious one has a trap:
#
#   1. Push-triggered — works from ANY branch, including a fresh one.
#      Pushing commits touching Sources/, Tests/ or this file starts a run.
#      This is the reliable route: nothing has to be merged first.
#
#   2. Manual — Actions ▸ iOS IPA ▸ "Run workflow".
#      TRAP: `workflow_dispatch` only offers the button once this file exists
#      on the DEFAULT branch. If you pushed your changes to a feature branch
#      and see no "Run workflow" button, that is why — either use route 1, or
#      land this file on the default branch first.
#
#   Also required in a fork: Actions are disabled by default. Open the Actions
#   tab once and click the "I understand my workflows, go ahead and enable them"
#   button, or no run starts at all.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version baked into the IPA (CFBundleShortVersionString)"
        required: false
        default: "0.3.22-ipad-qq"
      run_tests:
        description: "Compile and run the custom-source tests first (fast; never blocks the IPA)"
        type: boolean
        required: false
        default: true
      carplay:
        description: "Ship CarPlay (Info.plist scene + com.apple.developer.carplay-audio, ldid-injected after the build)"
        type: boolean
        required: false
        default: false

  # Route 1 above. Path-filtered so an unrelated push (a README tweak, an
  # upstream merge) does not kick off a 20-minute macOS build.
  push:
    branches: ["**"]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "ios/**"
      - ".github/workflows/ios-ipa.yml"

permissions:
  contents: read

# One build per ref. A second push while a build is running cancels the first —
# which is usually what you want when iterating on a compile error.
concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  # Naming for the human-facing artifact (the .ipa filename, matching the one
  # upstream's release.yml publishes: Kumone-iOS-<version>.ipa).
  APP_NAME: Kumone

  # The XcodeGen target/product name — deliberately NOT the same as APP_NAME.
  # ios/project.yml declares a target called `KumoneIOS`, and
  # ios/Config/Shared.xcconfig sets `PRODUCT_NAME = KumoneIOS`, so the built
  # bundle is KumoneIOS.app. The Home Screen label only *reads* "Kumone"
  # because of INFOPLIST_KEY_CFBundleDisplayName. Looking for Kumone.app fails
  # at packaging — i.e. after the entire build has already succeeded.
  IOS_SCHEME: KumoneIOS
  IOS_APP_NAME: KumoneIOS

  # Used when the run came from a push (no `inputs`), or when the caller left
  # the field blank.
  DEFAULT_VERSION: "0.3.22-ipad-qq"

  # CarPlay defaults to OFF again.
  #
  # The CarPlay path below is complete and verified as far as CI can verify it,
  # but it is a *different* change from the iPad UI work: it adds a scene
  # declaration to Info.plist and an entitlement to the executable. Shipping both
  # in one build would make a launch failure impossible to attribute, and CarPlay
  # does not exist on iPad anyway — so this build stays CarPlay-free and CarPlay
  # is one checkbox away (manual run → `carplay`).
  #
  # How it works when enabled: TrollStore's README states that "the binaries
  # inside an IPA can have arbitrary entitlements, fakesign them with ldid and
  # the entitlements you want (ldid -S <entitlements>) and TrollStore will
  # preserve the entitlements when resigning them with the fake root
  # certificate on installation." CODE_SIGNING_ALLOWED=NO means Xcode never
  # applies CODE_SIGN_ENTITLEMENTS, so the entitlement has to be injected after
  # the build — see the ldid step below.
  DEFAULT_CARPLAY: "0"

jobs:
  # ---------------------------------------------------------------------------
  # Compile + test, narrowly.
  #
  # This deliberately does NOT run a bare `swift build` / `swift test`. Those
  # build every target in the package, which drags in mlx-swift (StemKit, the
  # macOS-only AutoMix stem separation) — several minutes of C++/Metal for code
  # that has nothing to do with the iOS app or with the custom audio sources.
  #
  # Everything this change adds lives in the KumoneCore target, so building that
  # target and running KumoneCoreTests is the whole signal, in a fraction of the
  # time. A red result here is visible in the run, but it never blocks the IPA
  # job — the IPA is the point of this workflow.
  # ---------------------------------------------------------------------------
  verify:
    if: ${{ github.event_name == 'push' || inputs.run_tests }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcode-select -p
          xcodebuild -version
          swift --version
          # Fail loudly and early rather than 20 minutes into a compile: the
          # package header demands Swift 6.2, which only Xcode 26 ships.
          XCODE_MAJOR="$(xcodebuild -version | head -1 | awk '{print $2}' | cut -d. -f1)"
          if [ "${XCODE_MAJOR:-0}" -lt 26 ]; then
            echo "::error::Xcode $XCODE_MAJOR is too old; the package needs Swift 6.2 (Xcode 26+)."
            exit 1
          fi

      - name: Build KumoneCore
        run: |
          set -euo pipefail
          swift build --target KumoneCore

      - name: Custom-source tests
        run: |
          set -euo pipefail
          # Compile only the test target we care about, then run it without
          # rebuilding — this is what keeps StemKitTests (and therefore
          # mlx-swift) out of the critical path.
          if swift build --build-tests --target KumoneCoreTests; then
            swift test --skip-build --filter LXCustomSource
          else
            echo "::warning::Targeted test build unavailable; falling back to full 'swift test'."
            swift test --filter LXCustomSource
          fi

  # ---------------------------------------------------------------------------
  # The deliverable.
  # ---------------------------------------------------------------------------
  ipa:
    needs: [verify]
    # Runs even when `verify` was skipped (run_tests = false) or failed: a red
    # verify job is visible in the same run, so nothing is hidden by continuing.
    if: ${{ always() && !cancelled() }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Resolve version
        id: v
        env:
          IN_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # DEFAULT_VERSION is a workflow-level env var, so it is already in this
          # step's environment. On a push-triggered run there is no `inputs` at
          # all, and this is what fills the gap.
          V="${IN_VERSION:-${DEFAULT_VERSION:-0.3.22-ipad-qq}}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building version: $V"

      # Capability switches have to be resolved once, because a push-triggered run
      # has no `inputs` object at all while a manual one does.
      - name: Resolve capability switches
        id: caps
        env:
          IN_CARPLAY: ${{ inputs.carplay }}
        run: |
          set -euo pipefail
          # NOTE: the runner's /bin/bash is 3.2, so no ${VAR,,} here.
          CP="$(printf '%s' "${IN_CARPLAY:-${DEFAULT_CARPLAY:-0}}" | tr '[:lower:]' '[:upper:]')"
          case "$CP" in
            TRUE|1|YES|ON) echo "carplay=1" >> "$GITHUB_OUTPUT" ;;
            *) echo "carplay=0" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "CarPlay input resolved to: $CP"

      # Upstream keeps CarPlay behind an opt-in overlay because
      # `com.apple.developer.carplay-audio` is a restricted entitlement which a
      # normally-signed build cannot carry without an Apple-approved CarPlay
      # application. This artifact is UNSIGNED, so the overlay is safe here: the
      # entitlement travels in the binary via ldid (next step) and TrollStore
      # preserves it — something a certificate-based sideload cannot do.
      - name: Configure iOS build
        env:
          CARPLAY: ${{ steps.caps.outputs.carplay }}
        run: |
          set -euo pipefail
          if [ "$CARPLAY" = "1" ]; then
            bash Scripts/configure-ios.sh --carplay
          else
            bash Scripts/configure-ios.sh
          fi

      - name: Install ldid and prove it works (CarPlay builds only)
        if: ${{ steps.caps.outputs.carplay == '1' }}
        env:
          IOS_APP: ${{ env.IOS_APP_NAME }}
        run: |
          set -euo pipefail
          if command -v ldid >/dev/null 2>&1; then
            echo "ldid already present: $(command -v ldid)"
          else
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install ldid
          fi
          command -v ldid >/dev/null 2>&1 || {
            echo "::error::ldid is not on PATH after installing it"
            exit 1
          }

          # A functional probe, not `ldid -v`: this runs the exact operation the
          # packaging step depends on — inject an entitlement blob, read it back —
          # against a throwaway copy of a real Mach-O. A wrong or broken ldid then
          # fails here, before the 20-minute compile is paid for.
          ENT="ios/Config/Generated/$IOS_APP-CarPlay.entitlements"
          test -f "$ENT" || {
            echo "::error::$ENT is missing — Scripts/configure-ios.sh --carplay did not run"
            exit 1
          }
          PROBE="$(mktemp -d)/probe"
          cp /bin/ls "$PROBE"
          ldid -S"$ENT" "$PROBE"
          ldid -e "$PROBE" | grep -q 'com.apple.developer.carplay-audio' || {
            echo "::error::ldid ran but com.apple.developer.carplay-audio did not round-trip"
            exit 1
          }
          echo "ldid functional probe passed ✔"

      - name: Build unsigned iOS app
        env:
          VERSION: ${{ steps.v.outputs.version }}
          SCHEME: ${{ env.IOS_SCHEME }}
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/KumoneIOS.xcworkspace -scheme "$SCHEME" \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$(git rev-list --count HEAD)" \
            build

      # The one step Xcode cannot do for an unsigned build. With
      # CODE_SIGNING_ALLOWED=NO, CODE_SIGN_ENTITLEMENTS is never applied, so the
      # app would otherwise ship the CarPlay scene declaration in Info.plist
      # while carrying no entitlement to match — and CarPlay would silently
      # ignore the app. ldid "fakesigns" the executable with the entitlement,
      # which is exactly the procedure TrollStore documents for arbitrary
      # entitlements. TrollStore re-signs the app on install and keeps this blob.
      - name: Embed the CarPlay entitlement (ldid fakesign)
        if: ${{ steps.caps.outputs.carplay == '1' }}
        env:
          IOS_APP: ${{ env.IOS_APP_NAME }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/ios-dd/Build/Products/Release-iphoneos/$IOS_APP.app"
          ENT="ios/Config/Generated/$IOS_APP-CarPlay.entitlements"

          test -f "$ENT" || {
            echo "::error::$ENT is missing — Scripts/configure-ios.sh --carplay did not run"
            exit 1
          }
          command -v ldid >/dev/null 2>&1 || {
            echo "::error::ldid is missing — the 'Install ldid' step should have run first"
            exit 1
          }

          ldid -S"$ENT" "$APP/$IOS_APP"

          echo "--- entitlements embedded in $IOS_APP ---"
          ldid -e "$APP/$IOS_APP"
          if ! ldid -e "$APP/$IOS_APP" | grep -q 'com.apple.developer.carplay-audio'; then
            echo "::error::com.apple.developer.carplay-audio did not stick to $IOS_APP"
            exit 1
          fi

      - name: Package into an .ipa
        env:
          VERSION: ${{ steps.v.outputs.version }}
          IOS_APP: ${{ env.IOS_APP_NAME }}
        run: |
          set -euo pipefail
          PRODUCTS="$RUNNER_TEMP/ios-dd/Build/Products/Release-iphoneos"
          APP="$PRODUCTS/$IOS_APP.app"

          # Belt and braces. The expected name is known and asserted first, but
          # if it ever drifts (a rename in project.yml / Shared.xcconfig) this
          # falls back to whatever .app was actually produced instead of dying
          # 20 minutes in. A listing is printed on failure so the cause is
          # obvious from the log alone.
          if [ ! -d "$APP" ]; then
            echo "::warning::$IOS_APP.app not found; falling back to discovery."
            echo "--- $PRODUCTS ---"
            ls -la "$PRODUCTS" || true
            APP="$(find "$PRODUCTS" -maxdepth 1 -name '*.app' -print -quit)"
          fi
          test -n "$APP" && test -d "$APP" || {
            echo "::error::No .app bundle found under $PRODUCTS"
            exit 1
          }
          echo "Packaging: $APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" || true

          # CarPlay is asserted here because it cannot be asserted on a car from
          # CI. Both halves have to be present — the Info.plist scene AND the
          # entitlement in the executable — and either one silently degrading is
          # only visible on a head unit, which is the one place we cannot look.
          if [ "${{ steps.caps.outputs.carplay }}" = "1" ]; then
            /usr/libexec/PlistBuddy -c 'Print :UISupportsCarPlay' "$APP/Info.plist" >/dev/null || {
              echo "::error::UISupportsCarPlay missing from the packaged Info.plist"
              exit 1
            }
            CP_SCENE="$(/usr/libexec/PlistBuddy -c 'Print :UIApplicationSceneManifest:UISceneConfigurations:CPTemplateApplicationSceneSessionRoleApplication:0:UISceneDelegateClassName' "$APP/Info.plist" 2>/dev/null || true)"
            case "$CP_SCENE" in
              *CarPlaySceneDelegate)
                echo "CarPlay scene delegate: $CP_SCENE" ;;
              *)
                echo "::error::CarPlay scene delegate missing or wrong in Info.plist (got '${CP_SCENE:-<empty>}')"
                exit 1 ;;
            esac
            ldid -e "$APP/$IOS_APP" | grep -q 'com.apple.developer.carplay-audio' || {
              echo "::error::com.apple.developer.carplay-audio missing from the packaged executable"
              exit 1
            }
            echo "CarPlay: scene + entitlement both present ✔"
          else
            echo "CarPlay: disabled for this build (upstream default)"
          fi

          mkdir -p "$RUNNER_TEMP/payload/Payload"
          cp -R "$APP" "$RUNNER_TEMP/payload/Payload/"

          # An .ipa is nothing more than a zip of Payload/<App>.app, so the
          # packaging step is `zip` — no exportArchive, because that would
          # require the signing identity this build deliberately does not have.
          OUT="$APP_NAME-iOS-$VERSION.ipa"
          (cd "$RUNNER_TEMP/payload" && zip -qry "$GITHUB_WORKSPACE/$OUT" Payload)

          shasum -a 256 "$OUT" | tee "$OUT.sha256"

          # So a downloaded IPA can always be traced back to what produced it.
          {
            echo "app:      $APP_NAME"
            echo "bundle:   $(basename "$APP")"
            echo "bundle-id: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" 2>/dev/null || echo '?')"
            echo "version:  $VERSION"
            echo "carplay:  ${{ steps.caps.outputs.carplay }}"
            echo "commit:   $(git rev-parse HEAD)"
            echo "branch:   $GITHUB_REF_NAME"
            echo "xcode:    $(xcodebuild -version | head -1)"
            echo "swift:    $(swift --version | head -1)"
            echo "runner:   ${ImageOS:-?} ${ImageVersion:-?}"
            echo "built-at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$APP_NAME-iOS-$VERSION.BUILD-INFO.txt"

          echo "IPA: $OUT ($(du -h "$OUT" | cut -f1))"
          cat "$APP_NAME-iOS-$VERSION.BUILD-INFO.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-iOS-${{ steps.v.outputs.version }}
          path: |
            ${{ env.APP_NAME }}-iOS-${{ steps.v.outputs.version }}.ipa
            ${{ env.APP_NAME }}-iOS-${{ steps.v.outputs.version }}.ipa.sha256
            ${{ env.APP_NAME }}-iOS-${{ steps.v.outputs.version }}.BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30
